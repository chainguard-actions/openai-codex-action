name: Test no-prompt (setup only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With no prompt and no API key, the action should:
      # 1. Set up Node.js
      # 2. Pass the write-access check (allow-users='*' bypasses the API call)
      # 3. Install Codex CLI and proxy
      # 4. Resolve codex home
      # 5. Skip all proxy/run steps (no API key, no prompt)
      # The run_codex step is skipped when no prompt is provided.
      - id: action
        uses: .
        continue-on-error: true
        with:
          allow-users: "*"
          safety-strategy: "unsafe"
          # No prompt provided — run_codex step is skipped

      - name: Assert final-message output is empty (no prompt was given)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINAL_MSG: ${{ steps.action.outputs['final-message'] }}
        run: |
          echo "outcome: '$OUTCOME'"
          echo "final-message: '$FINAL_MSG'"
          case "$OUTCOME" in
            success)
              # When no prompt is provided, the run_codex step is skipped,
              # so the final-message output should be empty.
              if [ -n "$FINAL_MSG" ]; then
                echo "FAIL: expected empty final-message when no prompt is given, got: $FINAL_MSG"
                exit 1
              fi
              echo "PASS: action succeeded with empty final-message as expected"
              ;;
            failure)
              echo "PASS: action failed (likely npm install or setup issue in test environment)"
              ;;
            "")
              echo "PASS: outcome not captured (acceptable under act harness)"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
