name: Test prompt-file input without API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create prompt file
        run: |
          echo "List the files in the current directory." > /tmp/test-prompt.txt
          echo "Prompt file created at /tmp/test-prompt.txt"

      # With a prompt-file but no openai-api-key, the action will:
      # 1. Pass the write-access check (allow-users='*')
      # 2. Install Codex CLI and proxy
      # 3. Resolve codex home
      # 4. Skip proxy start (no API key)
      # 5. Attempt to run codex exec — which will fail because no API key is configured
      - id: action
        uses: .
        continue-on-error: true
        with:
          allow-users: "*"
          safety-strategy: "unsafe"
          prompt-file: "/tmp/test-prompt.txt"
          # No openai-api-key — codex exec will fail

      - name: Assert action failed or succeeded (codex exec without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINAL_MSG: ${{ steps.action.outputs['final-message'] }}
        run: |
          echo "outcome: '$OUTCOME'"
          echo "final-message: '$FINAL_MSG'"
          # Without an API key, codex exec is expected to fail.
          # We accept either failure (expected) or success (if codex handles it gracefully).
          case "$OUTCOME" in
            failure)
              echo "PASS: action failed as expected (no API key configured)"
              ;;
            success)
              echo "PASS: action succeeded (codex handled missing API key gracefully)"
              ;;
            "")
              echo "PASS: outcome not captured (acceptable under act harness)"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
