name: Test allow-users wildcard bypasses write-access check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: any-random-user
      GITHUB_REPOSITORY: some-owner/some-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # allow-users='*' should allow any actor without a GitHub token
          allow-users: "*"
          # No prompt so codex exec is skipped
          prompt: ""
          prompt-file: ""
          safety-strategy: unsafe

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without write-access rejection"
