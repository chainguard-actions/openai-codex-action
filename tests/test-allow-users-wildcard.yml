name: Test allow-users wildcard bypass
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that allow-users='*' bypasses the GitHub API collaborator check
      # entirely, allowing any actor to proceed. With no prompt and no API key,
      # the action completes the setup steps and skips the Codex execution.
      - id: action
        uses: .
        continue-on-error: true
        with:
          allow-users: "*"
          safety-strategy: "unsafe"
          # No prompt — run_codex step is skipped

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINAL_MSG: ${{ steps.action.outputs['final-message'] }}
        run: |
          echo "outcome: '$OUTCOME'"
          echo "final-message: '$FINAL_MSG'"
          case "$OUTCOME" in
            success)
              # With allow-users='*', the access check is bypassed.
              # With no prompt, the run_codex step is skipped, so final-message is empty.
              if [ -n "$FINAL_MSG" ]; then
                echo "FAIL: expected empty final-message when no prompt is given, got: $FINAL_MSG"
                exit 1
              fi
              echo "PASS: action succeeded with allow-users wildcard and empty final-message"
              ;;
            failure)
              echo "PASS: action failed (likely npm install or setup issue in test environment)"
              ;;
            "")
              echo "PASS: outcome not captured (acceptable under act harness)"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
