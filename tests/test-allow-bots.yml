name: Test allow-bots input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that allow-bots: true is accepted and processed.
      # No prompt is provided so codex exec is skipped.
      # The write-access check may fail on the sentinel repo.
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: ""
          allow-bots: "true"
          safety-strategy: "unsafe"

      - name: Assert action ran with allow-bots enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Either success or failure are acceptable (sentinel repo may cause failure).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' with allow-bots=true"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
