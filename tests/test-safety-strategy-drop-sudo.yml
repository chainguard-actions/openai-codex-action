name: Test safety-strategy drop-sudo (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With safety-strategy: drop-sudo (the default) and no prompt,
      # the action should drop sudo privileges and verify they are removed.
      # The write-access check may fail on the sentinel repo.
      # Note: drop-sudo + no prompt triggers the drop-sudo step on non-Linux
      # or when prompt is empty on Linux (per the action's conditional logic).
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: ""
          safety-strategy: "drop-sudo"

      - name: Assert action ran with drop-sudo safety strategy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With drop-sudo and no prompt:
          # - success: write-access check passed, drop-sudo ran, codex exec skipped
          # - failure: sentinel repo write-access check failed, or drop-sudo failed
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' using drop-sudo safety-strategy"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
