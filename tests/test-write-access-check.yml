name: Test write-access check on sentinel repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No allow-users override: the write-access check runs against the
          # sentinel GITHUB_REPOSITORY, which does not exist on GitHub.
          # The action is expected to fail at the check-write-access step.
          safety-strategy: unsafe

      - name: Assert action failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (sentinel repo not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (write-access check passed unexpectedly)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
