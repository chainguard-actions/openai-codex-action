name: Test prompt-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create prompt file
        run: |
          echo "Print the word HELLO and nothing else." > "$GITHUB_WORKSPACE/test-prompt.txt"

      # Pass a prompt-file. No API key is provided, so the proxy is skipped.
      # The action will attempt to run codex exec but will fail without credentials.
      # The write-access check may also fail on the sentinel repo.
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt-file: "${{ github.workspace }}/test-prompt.txt"
          safety-strategy: "unsafe"

      - name: Assert action ran with prompt-file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without an API key, codex exec will fail (no credentials).
          # The write-access check may also fail on the sentinel repo.
          # Both failure and success are acceptable outcomes here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
