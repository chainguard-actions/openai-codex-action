name: Test no-prompt skips codex exec
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: test-user
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # No prompt provided — run_codex step should be skipped
          prompt: ""
          prompt-file: ""
          allow-users: "*"
          safety-strategy: unsafe

      - name: Assert final-message is empty when no prompt given
        env:
          FINAL_MSG: ${{ steps.action.outputs['final-message'] }}
        run: |
          echo "final-message: '$FINAL_MSG'"
          # When no prompt is provided the run_codex step is skipped,
          # so the output should be empty.
          if [ -n "$FINAL_MSG" ]; then
            echo "FAIL: expected empty final-message but got: $FINAL_MSG"
            exit 1
          fi
          echo "PASS: final-message is empty as expected"
