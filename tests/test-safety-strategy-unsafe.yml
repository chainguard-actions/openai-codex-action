name: Test safety-strategy unsafe (no sudo drop)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With safety-strategy: unsafe, the action skips the drop-sudo and
      # verify-sudo steps. No prompt is provided so codex exec is also skipped.
      # The write-access check may fail on the sentinel repo.
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: ""
          safety-strategy: "unsafe"

      - name: Assert action ran with unsafe safety strategy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With unsafe strategy and no prompt, the action should either:
          # - succeed (write-access check passed, codex exec skipped)
          # - fail (sentinel repo write-access check failed)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' using unsafe safety-strategy"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
