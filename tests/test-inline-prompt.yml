name: Test inline prompt input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Print the word HELLO and nothing else."
          # No openai-api-key: proxy steps are skipped.
          # allow-users '*' bypasses the write-access collaborator API call.
          allow-users: "*"
          safety-strategy: unsafe

      - name: Assert action ran (codex exec attempted or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FINAL_MESSAGE: ${{ steps.action.outputs.final-message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "final-message: $FINAL_MESSAGE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (codex exec ran)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
